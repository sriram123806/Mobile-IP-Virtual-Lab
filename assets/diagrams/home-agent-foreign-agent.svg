<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI,Arial,sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101A35"/></marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5fd6"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#56B8E8"/><stop offset="1" stop-color="#9478E8"/></linearGradient></defs>
<rect width="640" height="360" rx="18" fill="#f4f8ff"/><rect x="30" y="30" width="260" height="200" rx="10" fill="#f3edff" stroke="#9478E8" stroke-width="2"/><text x="160" y="63.95" font-size="17" font-weight="700" fill="#101A35" text-anchor="middle"><tspan x="160" dy="0">Home Agent (HA)</tspan></text><text x="160" y="97.55" font-size="13" font-weight="400" fill="#101A35" text-anchor="middle"><tspan x="160" dy="0">Router on the home network</tspan><tspan x="160" dy="16">Keeps a binding table:</tspan><tspan x="160" dy="16">Home address  →  Care-of address</tspan><tspan x="160" dy="16">Intercepts packets for the MN</tspan><tspan x="160" dy="16">Encapsulates and tunnels them</tspan></text><rect x="350" y="30" width="260" height="200" rx="10" fill="#e9fbfb" stroke="#68E0E0" stroke-width="2"/><text x="480" y="63.95" font-size="17" font-weight="700" fill="#101A35" text-anchor="middle"><tspan x="480" dy="0">Foreign Agent (FA)</tspan></text><text x="480" y="97.55" font-size="13" font-weight="400" fill="#101A35" text-anchor="middle"><tspan x="480" dy="0">Router on the visited network</tspan><tspan x="480" dy="16">Advertises a care-of address</tspan><tspan x="480" dy="16">Registers the MN with its HA</tspan><tspan x="480" dy="16">Decapsulates tunnelled packets</tspan><tspan x="480" dy="16">Delivers them to the MN</tspan></text><line x1="290" y1="130" x2="350" y2="130" stroke="#7a5fd6" stroke-width="2.5" marker-end="url(#v)" marker-start="url(#v)"/><text x="320" y="111.85" font-size="11" font-weight="700" fill="#7a5fd6" text-anchor="middle"><tspan x="320" dy="0">Tunnel</tspan></text><rect x="400" y="282" width="160" height="50" rx="10" fill="#ffffff" stroke="#56B8E8" stroke-width="2"/><text x="480.0" y="303.55" font-size="13" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="480.0" dy="0">Mobile Node (MN)</tspan><tspan x="480.0" dy="16">visiting</tspan></text><line x1="480" y1="230" x2="480" y2="282" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><rect x="70" y="282" width="180" height="50" rx="10" fill="#fff" stroke="#9478E8" stroke-width="2" stroke-dasharray="6 5"/><text x="160.0" y="303.7" font-size="12" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="160.0" dy="0">Home address</tspan><tspan x="160.0" dy="15">10.1.1.5 (example)</tspan></text><line x1="160" y1="230" x2="160" y2="282" stroke="#101A35" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/></svg>