<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI,Arial,sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101A35"/></marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5fd6"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#56B8E8"/><stop offset="1" stop-color="#9478E8"/></linearGradient></defs>
<rect width="640" height="360" rx="18" fill="#f4f8ff"/><rect x="20" y="150" width="70" height="50" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><text x="55.0" y="179.9" font-size="14" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="55.0" dy="0">CN</tspan></text><rect x="185" y="150" width="70" height="50" rx="10" fill="#e6dcff" stroke="#56B8E8" stroke-width="2"/><text x="220.0" y="179.9" font-size="14" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="220.0" dy="0">HA</tspan></text><rect x="405" y="150" width="70" height="50" rx="10" fill="#d6f6f6" stroke="#56B8E8" stroke-width="2"/><text x="440.0" y="179.9" font-size="14" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="440.0" dy="0">FA</tspan></text><rect x="555" y="150" width="70" height="50" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><text x="590.0" y="179.9" font-size="14" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="590.0" dy="0">MN</tspan></text><rect x="255" y="140" width="150" height="70" rx="35" fill="#efe9ff" stroke="#9478E8" stroke-width="2" stroke-dasharray="6 5"/><text x="330" y="171.7" font-size="12" font-weight="700" fill="#7a5fd6" text-anchor="middle"><tspan x="330" dy="0">Reverse tunnel</tspan><tspan x="330" dy="15">(IP-in-IP)</tspan></text><line x1="555" y1="175" x2="475" y2="175" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><line x1="405" y1="175" x2="398" y2="175" stroke="#7a5fd6" stroke-width="2.5" marker-end="url(#v)"/><line x1="262" y1="175" x2="255" y2="175" stroke="#7a5fd6" stroke-width="2.5" marker-end="url(#v)"/><line x1="185" y1="175" x2="90" y2="175" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><rect x="70" y="60" width="500" height="50" rx="10" fill="#e8f6fd" stroke="#56B8E8" stroke-width="2"/><text x="320.0" y="81.7" font-size="12" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="320.0" dy="0">MN sends to CN via FA; FA tunnels it to the HA (source = CoA);</tspan><tspan x="320.0" dy="15">HA decapsulates and forwards to CN with the MN’s home address as source</tspan></text><text x="320" y="266.55" font-size="13" font-weight="500" fill="#46506d" text-anchor="middle"><tspan x="320" dy="0">Why: routers that filter by source address (ingress filtering)</tspan><tspan x="320" dy="16">would drop packets sent straight from the foreign network.</tspan></text><text x="320" y="339.55" font-size="13" font-weight="600" fill="#46506d" text-anchor="middle"><tspan x="320" dy="0">MN → FA → (tunnel) → HA → CN</tspan></text></svg>