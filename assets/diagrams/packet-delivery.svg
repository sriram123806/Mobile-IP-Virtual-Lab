<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Segoe UI,Arial,sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#101A35"/></marker>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a5fd6"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#56B8E8"/><stop offset="1" stop-color="#9478E8"/></linearGradient></defs>
<rect width="640" height="270" rx="18" fill="#f4f8ff"/><text x="320" y="33.6" font-size="16" font-weight="700" fill="#101A35" text-anchor="middle"><tspan x="320" dy="0">Complete packet delivery</tspan></text><rect x="14" y="70" width="112" height="120" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><circle cx="70" cy="92" r="14" fill="url(#g)"/><text x="70" y="96.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="70" dy="0">1</tspan></text><text x="70" y="139.2" font-size="12" font-weight="500" fill="#101A35" text-anchor="middle"><tspan x="70" dy="0">CN sends</tspan><tspan x="70" dy="15">packet to MN</tspan><tspan x="70" dy="15">home address</tspan></text><line x1="126" y1="130" x2="138" y2="130" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><rect x="138" y="70" width="112" height="120" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><circle cx="194" cy="92" r="14" fill="url(#g)"/><text x="194" y="96.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="194" dy="0">2</tspan></text><text x="194" y="146.7" font-size="12" font-weight="500" fill="#101A35" text-anchor="middle"><tspan x="194" dy="0">HA intercepts</tspan><tspan x="194" dy="15">(proxy ARP)</tspan></text><line x1="250" y1="130" x2="262" y2="130" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><rect x="262" y="70" width="112" height="120" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><circle cx="318" cy="92" r="14" fill="url(#g)"/><text x="318" y="96.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="318" dy="0">3</tspan></text><text x="318" y="139.2" font-size="12" font-weight="500" fill="#101A35" text-anchor="middle"><tspan x="318" dy="0">HA looks up</tspan><tspan x="318" dy="15">CoA, adds outer</tspan><tspan x="318" dy="15">header</tspan></text><line x1="374" y1="130" x2="386" y2="130" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><rect x="386" y="70" width="112" height="120" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><circle cx="442" cy="92" r="14" fill="url(#g)"/><text x="442" y="96.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="442" dy="0">4</tspan></text><text x="442" y="146.7" font-size="12" font-weight="500" fill="#101A35" text-anchor="middle"><tspan x="442" dy="0">FA removes</tspan><tspan x="442" dy="15">outer header</tspan></text><line x1="498" y1="130" x2="510" y2="130" stroke="#101A35" stroke-width="2.5" marker-end="url(#a)"/><rect x="510" y="70" width="112" height="120" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><circle cx="566" cy="92" r="14" fill="url(#g)"/><text x="566" y="96.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="566" dy="0">5</tspan></text><text x="566" y="146.7" font-size="12" font-weight="500" fill="#101A35" text-anchor="middle"><tspan x="566" dy="0">FA delivers</tspan><tspan x="566" dy="15">to MN</tspan></text><text x="320" y="236.55" font-size="13" font-weight="500" fill="#46506d" text-anchor="middle"><tspan x="320" dy="0">Reply path: MN → CN may go directly (triangular routing)</tspan><tspan x="320" dy="16">or through the reverse tunnel.</tspan></text></svg>