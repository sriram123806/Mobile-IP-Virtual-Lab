<rect width="640" height="360" rx="18" fill="#f4f8ff"/><text x="320" y="27.25" font-size="15" font-weight="700" fill="#101A35" text-anchor="middle"><tspan x="320" dy="0">Same packet, three moments</tspan></text><text x="18" y="66.7" font-size="12" font-weight="700" fill="#46506d" text-anchor="start"><tspan x="18" dy="0">Original</tspan><tspan x="18" dy="15">(at CN / HA)</tspan></text><rect x="190" y="48" width="150" height="44" rx="10" fill="#e8f6fd" stroke="#56B8E8" stroke-width="2"/><text x="265.0" y="66.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="265.0" dy="0">Inner IP header</tspan><tspan x="265.0" dy="14">CN → MN home addr</tspan></text><rect x="342" y="48" width="100" height="44" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><text x="392.0" y="73.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="392.0" dy="0">Data</tspan></text><line x1="300" y1="100" x2="300" y2="128" stroke="#7a5fd6" stroke-width="2.5" marker-end="url(#v)"/><text x="400" y="123.2" font-size="12" font-weight="700" fill="#7a5fd6" text-anchor="start"><tspan x="400" dy="0">HA encapsulates</tspan></text><text x="18" y="152.7" font-size="12" font-weight="700" fill="#46506d" text-anchor="start"><tspan x="18" dy="0">Tunnelled</tspan><tspan x="18" dy="15">(HA to FA)</tspan></text><rect x="190" y="134" width="130" height="44" rx="10" fill="#e6dcff" stroke="#56B8E8" stroke-width="2"/><text x="255.0" y="152.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="255.0" dy="0">Outer IP header</tspan><tspan x="255.0" dy="14">HA → CoA</tspan></text><rect x="322" y="134" width="130" height="44" rx="10" fill="#e8f6fd" stroke="#56B8E8" stroke-width="2"/><text x="387.0" y="152.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="387.0" dy="0">Inner IP header</tspan><tspan x="387.0" dy="14">CN → MN home</tspan></text><rect x="454" y="134" width="80" height="44" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><text x="494.0" y="159.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="494.0" dy="0">Data</tspan></text><line x1="300" y1="186" x2="300" y2="214" stroke="#7a5fd6" stroke-width="2.5" marker-end="url(#v)"/><text x="400" y="209.2" font-size="12" font-weight="700" fill="#7a5fd6" text-anchor="start"><tspan x="400" dy="0">FA decapsulates</tspan></text><text x="18" y="238.7" font-size="12" font-weight="700" fill="#46506d" text-anchor="start"><tspan x="18" dy="0">Delivered</tspan><tspan x="18" dy="15">(FA to MN)</tspan></text><rect x="190" y="220" width="150" height="44" rx="10" fill="#e8f6fd" stroke="#56B8E8" stroke-width="2"/><text x="265.0" y="238.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="265.0" dy="0">Inner IP header</tspan><tspan x="265.0" dy="14">CN → MN home addr</tspan></text><rect x="342" y="220" width="100" height="44" rx="10" fill="#fff" stroke="#56B8E8" stroke-width="2"/><text x="392.0" y="245.85" font-size="11" font-weight="600" fill="#101A35" text-anchor="middle"><tspan x="392.0" dy="0">Data</tspan></text><text x="320" y="296.7" font-size="12" font-weight="500" fill="#46506d" text-anchor="middle"><tspan x="320" dy="0">Outer header is added at the tunnel entry and removed at the tunnel exit.</tspan><tspan x="320" dy="15">The original packet is never changed.</tspan></text></svg>