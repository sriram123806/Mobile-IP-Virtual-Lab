<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Packet Dash – Live Gameplay | Mobile IP Virtual Lab</title>
  <meta name="description" content="Play Packet Dash: Experience Mobile IP Home Agent encapsulation, tunneling, and Foreign Agent decapsulation in an interactive adventure.">
  <meta name="theme-color" content="#050816">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/global.css">

  <style>
    /* ================================================================
       SQUID GAME STAIRCASE BACKGROUND
       ================================================================ */
    .lab-bg-game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('../assets/backgrounds/bg-game-staircase.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }

    .lab-bg-game::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(4, 9, 24, 0.42);
    }

    /* Page container */
    .play-page-wrap {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 40px;
      box-sizing: border-box;
    }

    /* Controls header strip */
    .play-header-strip {
      width: 100%;
      max-width: 1060px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .play-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .play-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      letter-spacing: 0.04em;
      text-shadow: 0 0 16px rgba(0, 210, 255, 0.6);
    }

    .play-payload-pill {
      font-size: 0.88rem;
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      color: #d1fae5;
      background: #064e3b;
      border: 1px solid #10b981;
      padding: 4px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .play-payload-pill b {
      color: #ffffff;
    }

    .play-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-change-msg {
      background: #0f1c3d;
      color: #7dd3fc;
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 10px;
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      font-size: 0.86rem;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-change-msg:hover {
      background: #182c60;
      color: #ffffff;
      border-color: #00d2ff;
    }

    /* Embedded Game Container (Medium-to-large, solid, sharp) */
    .game-embed-container {
      width: 100%;
      max-width: 1060px;
      height: 610px;
      background: #060d24;
      border: 2px solid rgba(0, 210, 255, 0.6);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 210, 255, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-embed-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
    }

    @media (max-width: 768px) {
      .game-embed-container {
        height: 480px;
      }
      .play-header-strip {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="lab-page">

  <!-- Squid Game Colorful Staircase Background Visual -->
  <div class="lab-bg-game" aria-hidden="true"></div>

  <!-- Global Website Navigation Bar (Always Accessible During Gameplay) -->
  <nav id="lab-nav" data-active="game" role="navigation" aria-label="Virtual Lab Sections"></nav>

  <div class="play-page-wrap">

    <!-- Top Action & Info Bar -->
    <div class="play-header-strip">
      <div class="play-title-wrap">
        <h1 class="play-title">PACKET DASH</h1>
        <div class="play-payload-pill">
          <span>Payload:</span>
          <b id="active-payload-text">"Hello, I'm Sriram!"</b>
        </div>
      </div>
      <div class="play-actions">
        <a href="game-message.html" class="btn-change-msg" title="Change your packet message">
          ✏️ Change Message
        </a>
        <a href="game.html" class="btn-change-msg" title="Back to Game Overview">
          ← Game Overview
        </a>
      </div>
    </div>

    <!-- Medium-to-Large Embedded Game Container -->
    <div class="game-embed-container" id="game-container">
      <iframe id="game-frame" class="game-embed-frame" title="Packet Dash Game" allow="autoplay"></iframe>
    </div>

  </div>

  <!-- Global Navigation Script -->
  <script src="../scripts/global-nav.js"></script>

  <!-- Gameplay Page Logic -->
  <script>
    (function () {
      'use strict';

      // Read message from URL parameter or sessionStorage
      var params = new URLSearchParams(window.location.search);
      var msg = params.get('msg');
      if (!msg) {
        try {
          var saved = sessionStorage.getItem('packet_dash_msg');
          if (saved && saved.trim()) msg = saved.trim();
        } catch (e) {}
      }
      if (!msg) msg = "Hello, I'm Sriram!";

      // Update payload text display
      var payloadEl = document.getElementById('active-payload-text');
      if (payloadEl) payloadEl.textContent = '"' + msg + '"';

      // Load Game in Iframe
      var frame = document.getElementById('game-frame');
      var encoded = encodeURIComponent(msg);
      frame.src = '../game/index.html?msg=' + encoded;

      // Listen for postMessage from game iframe
      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'EXIT_GAME') {
          window.location.href = 'game.html';
        } else if (e.data.type === 'CHANGE_MESSAGE') {
          window.location.href = 'game-message.html';
        }
      });

    })();
  </script>

  <!-- Shinchi Floating Chatbot Widget Script -->
  <script src="../shinchi/frontend/js/shinchi-widget.js" data-mode="floating"></script>

</body>
</html>
