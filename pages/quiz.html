<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | Mobile IP Virtual Lab</title>
  <meta name="description" content="Test your knowledge of Mobile IP with 5 random questions from a bank of 10.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/global.css">
  <style>
    /* Clean white page title */
    .lab-page-title {
      font-family: var(--lab-font-title);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      letter-spacing: 0.08em;
    }

    /* Light glass panels with dark text */
    
    

    /* Quiz Option Buttons */
    .mip-opts {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0;
    }

    .mip-opt {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      font: inherit;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .mip-opt:hover {
      border-color: #3b82f6;
      background: #f0f7ff;
      transform: translateY(-1px);
    }

    /* Distinct Selected Highlight - GREEN */
    .mip-opt.mip-sel {
      border: 2px solid #16a34a !important;
      background: #f0fdf4 !important;
      color: #14532d !important;
      font-weight: 600;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2), 0 4px 12px rgba(22, 163, 74, 0.12) !important;
    }

    .opt-badge {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .mip-opt.mip-sel .opt-badge {
      background: #16a34a !important;
      color: #ffffff !important;
    }
    .opt-text {
      flex: 1;
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .opt-check {
      font-size: 0.85rem;
      font-weight: 700;
      color: #16a34a !important;
      background: #dcfce7 !important;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Progress bar */
    .mip-progress {
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0 16px;
    }
    .mip-progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      transition: width 0.3s ease;
    }

    /* Review cards */
    .mip-rev {
      border-left: 5px solid #ef4444;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 8px;
      margin: 10px 0;
      color: #1e293b;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }
    .mip-rev.mip-right {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    /* History table */
    table.mip-hist {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      color: #1e293b;
      margin-top: 8px;
    }
    table.mip-hist th, table.mip-hist td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }
    table.mip-hist th {
      color: #0f172a;
      font-weight: 700;
      background: #f8fafc;
    }
  </style>
</head>
<body class="lab-page">

  <!-- Restored Background Image -->
  <div class="lab-bg lab-bg-quiz" aria-hidden="true"></div>

  <!-- Background -->
  

  <!-- Navigation -->
  <nav id="lab-nav" data-active="quiz"></nav>

  <main class="lab-wrap">
    <header class="lab-hero"><div class="lab-hero-content">
      <h1 class="lab-page-title">QUIZ</h1>
      <p class="lab-page-sub">Interactive Knowledge Assessment &mdash; 5 Random Questions from the Mobile IP Bank</p>
      <div class="lab-page-bar"></div>
    </section>

    <div style="max-width:860px;margin:0 auto;">
      <!-- Active Quiz Card -->
      <section class="lab-panel-white" id="mip-quiz-box" aria-live="polite">
        <!-- Renders dynamically via scripts/quiz.js -->
      </section>
    </div>
  </main>

  <footer class="lab-foot">Home Agent and Foreign Agent Tunneling &middot; An Interactive Mobile IP Virtual Laboratory</footer>

  <script src="../scripts/global-nav.js"></script>
  <script src="../scripts/quiz.js"></script>
</body>
</html>
