<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Quiz | Mobile IP Virtual Lab</title>
  <meta name='description' content='Test your knowledge of Mobile IP with 5 random questions from a bank of 10.'>
  <link rel='icon' href='../assets/icons/favicon.svg' type='image/svg+xml'>
  <link rel='preconnect' href='https://fonts.googleapis.com'>
  <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
  <link href='https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap' rel='stylesheet'>
  <link rel='stylesheet' href='../styles/global.css'>
  <style>
    /* Alias mip- classes to lab- styles so quiz.js works with global.css design */
    .mip-btn { display:inline-flex;align-items:center;justify-content:center;padding:10px 22px;border-radius:12px;border:none;cursor:pointer;font:600 .88rem/1 var(--lab-font-body);letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,var(--lab-blue),var(--lab-violet));transition:transform .15s,box-shadow .2s; }
    .mip-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(148,120,232,.55);}
    .mip-btn:disabled{opacity:.4;cursor:not-allowed;}
    .mip-btn-alt{background:rgba(255,255,255,.9);color:var(--lab-navy);border:1.5px solid var(--lab-violet);}
    .mip-progress{height:10px;background:rgba(16,26,53,.2);border-radius:99px;overflow:hidden;margin:6px 0 14px;}
    .mip-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lab-cyan),var(--lab-violet));transition:width .3s;}
    .mip-opts{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
    .mip-opt{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--lab-blue);background:rgba(255,255,255,.92);font:inherit;color:#18233B;cursor:pointer;transition:all .2s;width:100%;}
    .mip-opt:hover{border-color:var(--lab-violet);background:#fff;}
    .mip-opt.mip-sel{border-color:var(--lab-violet);background:rgba(199,184,245,.5);font-weight:600;}
    .mip-rev{border-left:6px solid var(--lab-bad);padding:10px 14px;background:rgba(255,255,255,.9);border-radius:10px;margin:10px 0;color:#18233B;}
    .mip-rev.mip-right{border-color:var(--lab-ok);}
    .mip-score{font-size:2.4rem;font-weight:800;color:var(--lab-violet);margin:0;display:block;}
    table.mip-hist{width:100%;border-collapse:collapse;font-size:.9rem;color:#18233B;}
    .mip-hist th,.mip-hist td{padding:6px 8px;border-bottom:1px solid var(--lab-lav);text-align:left;}
    .mip-empty{color:#667;font-style:italic;font-size:.84rem;}
    .mip-note{font-size:.8rem;color:#4a5578;margin:4px 0 0;}
  </style>
</head>
<body class='lab-page'>
  <div class='lab-bg lab-bg-quiz' aria-hidden='true'></div>
  <nav id='lab-nav' data-active='quiz'></nav>
  
  <main class='lab-wrap'>
    <section class='lab-hero'>
      <h1 class='lab-page-title'>Quiz</h1>
      <div class='lab-page-bar'></div>
      <p class='lab-page-sub'>Five randomly selected questions from a bank of ten. Answers are shuffled each attempt.</p>
    </section>
    
    <div style='max-width:820px;margin:0 auto;'>
      <section class='lab-panel' id='mip-quiz-box' aria-live='polite'>
        <!-- Quiz renders here via quiz.js -->
      </section>
      
      <section class='lab-panel'>
        <h2>Attempt History</h2>
        <div id='mip-history'></div>
      </section>
    </div>
  </main>
  
  <footer class='lab-foot'>Home Agent and Foreign Agent Tunneling &middot; An Interactive Mobile IP Virtual Laboratory</footer>
  
  <script src='../scripts/global-nav.js'></script>
  <script src='../scripts/quiz.js'></script>
</body>
</html>
